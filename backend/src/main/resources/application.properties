spring.application.name=demo

# DataSource Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/my_pq_db}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin}

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.defer-datasource-initialization=true

# Flyway Configuration
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.locations=${SPRING_FLYWAY_LOCATIONS:classpath:db/migration}
spring.flyway.baseline-on-migrate=true
spring.flyway.baselineVersion=0

# JWT Configuration
app.jwt.secret=${APP_JWT_SECRET:mysecretkeymysecretkeymysecretkeymysecretkeymysecretkeymysecretmysecretkey}
app.jwt.expiration=${APP_JWT_EXPIRATION:2592000000}

# Admin Configuration
app.admin.register.code=${APP_ADMIN_REGISTER_CODE:282828282}

# mailTrap Configuration
spring.mail.host=${SPRING_MAIL_HOST:sandbox.smtp.mailtrap.io}
spring.mail.port=${SPRING_MAIL_PORT:2525}
spring.mail.username=${SPRING_MAIL_USERNAME:b17ef51fdbf0cb}
spring.mail.password=${SPRING_MAIL_PASSWORD:98bc86e34d6f1d}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.required=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_REQUIRED:false}
spring.mail.from=gabrielvalentine738@gmail.com

# email Verification
app.email.verification.expiration=86400000
app.frontend.url=http://localhost:3000/verify-email

# ============================================
# FreeMarker Configuration
# ============================================
spring.freemarker.check-template-location=false

# ============================================
# Actuator Health Checks
# ============================================
management.endpoints.web.exposure.include=health,metrics,info
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true
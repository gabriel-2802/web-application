services:
  postgres:
    build:
      context: .
      dockerfile: db.Dockerfile
    container_name: postgres-db
    environment:
      POSTGRES_USER: ${DB_USER:-postgresadmin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-StrongPassword123!}
      POSTGRES_DB: ${DB_NAME:-my_pq_db}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      - ./backend/target/classes/db/migration:/docker-entrypoint-initdb.d:ro
      - postgres_data:/var/lib/postgresql/data
    networks:
      - data-net
    # internal communication only
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    container_name: spring-backend
    environment:
      # database Connection
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-my_pq_db}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-postgresadmin}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-StrongPassword123!}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver

      # jpa
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_JPA_SHOW_SQL: "false"
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect

      # flyway
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration

      # JWT
      APP_JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-prod}
      APP_JWT_EXPIRATION: ${JWT_EXPIRATION:-2592000000}

      # admin conf
      APP_ADMIN_REGISTER_CODE: ${ADMIN_REGISTER_CODE:-282828282}

      # mail
      SPRING_MAIL_HOST: ${MAIL_HOST:-sandbox.smtp.mailtrap.io}
      SPRING_MAIL_PORT: ${MAIL_PORT:-2525}
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME:-your-username}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD:-your-password}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "true"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "true"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_REQUIRED: "false"
      SPRING_MAIL_FROM: ${MAIL_FROM:-noreply@example.com}
      APP_EMAIL_VERIFICATION_EXPIRATION: ${EMAIL_VERIFICATION_EXPIRATION:-86400000}
      APP_FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000/verify-email}

      # server configuration
      SERVER_PORT: 8080
      SERVER_SERVLET_CONTEXT_PATH: /

      # CORS - allow React dev server origin
      SPRING_WEB_CORS_ALLOWED_ORIGINS: http://localhost:3000

    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dmz-net
      - data-net
    # no ports from outside
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8080"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    container_name: react-frontend
    environment:
      # API calls to the backend container
      REACT_APP_API_URL: ${REACT_APP_API_URL:-http://backend:8080}
      HOST: "0.0.0.0"
      CI: "false"
      # disable browser auto-open
      BROWSER: none
    ports:
      # expose React dev server to host on port 3000
      - "${FRONTEND_PORT:-3000}:3000"
    networks:
      - dmz-net
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

networks:
  dmz-net:
    driver: bridge
  data-net:
    driver: bridge
  
volumes:
  postgres_data:
    driver: local
